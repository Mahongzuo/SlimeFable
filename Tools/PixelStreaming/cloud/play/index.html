<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SlimeFable 连接</title>
  <style>
    body { margin: 0; min-height: 100vh; background: #2a2218; color: #f3ead8; font-family: "Microsoft YaHei", sans-serif; }
    main { max-width: 720px; margin: 0 auto; padding: 40px 20px; }
    h1 { font-weight: 600; letter-spacing: 0.04em; }
    .muted { color: #c4b49a; }
    .toggle { display: flex; gap: 8px; margin: 16px 0 20px; }
    .toggle button {
      color: #f3ead8; background: #3a2f24; border: 1px solid #8a7348;
      border-radius: 8px; padding: 8px 16px; cursor: pointer;
    }
    .toggle button.active { background: #5a4630; border-color: #c4a46a; }
    label { display: block; margin: 12px 0 6px; color: #c4b49a; font-size: 14px; }
    input[type="password"], input[type="text"] {
      width: 100%; box-sizing: border-box; padding: 10px 12px;
      background: #3a2f24; color: #f3ead8; border: 1px solid #8a7348; border-radius: 8px;
    }
    .seats { display: grid; gap: 16px; margin-top: 20px; }
    .card { background: #3a2f24; border: 1px solid #8a7348; border-radius: 12px; padding: 18px; }
    .row { display: flex; gap: 10px; flex-wrap: wrap; margin-top: 12px; }
    a.btn, button.btn {
      display: inline-block; text-decoration: none; color: #f3ead8; background: #5a4630;
      border: 1px solid #c4a46a; border-radius: 8px; padding: 10px 16px; cursor: pointer;
    }
    a.btn[disabled], button.btn[disabled] { opacity: 0.4; pointer-events: none; }
    .err { color: #e8b4a0; margin-top: 16px; }
  </style>
</head>
<body>
  <main>
    <h1>历史上的今天</h1>
    <p class="muted">选座位后连接。游玩仅一人；观看不操作。本页只做连接，不改 been.chat 主站。</p>
    <div class="toggle">
      <button type="button" id="btn-local">本机</button>
      <button type="button" id="btn-cloud">云端</button>
    </div>
    <label for="token">口令</label>
    <input id="token" type="password" autocomplete="off" placeholder="与 worker.config.json / SLIME_PLAY_TOKEN 相同" />
    <div id="seats" class="seats"></div>
    <p class="muted" style="margin-top:24px">座位未就绪时也可先打开官方播放器排查信令。Signalling url 必须是 <code>wss://been.chat/ps/player</code>，不要用 <code>/ps/play</code>。</p>
    <div class="row">
      <a class="btn" id="open-player" href="#">直接打开播放器</a>
    </div>
    <p id="err" class="err"></p>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const onBeen = location.hostname === "been.chat" || location.hostname.endsWith(".been.chat");
    const STORAGE_TARGET = "slimePlayTarget";
    const STORAGE_TOKEN = "slimePlayToken";

    const err = document.getElementById("err");
    const box = document.getElementById("seats");
    const tokenInput = document.getElementById("token");
    const btnLocal = document.getElementById("btn-local");
    const btnCloud = document.getElementById("btn-cloud");

    let target = params.get("target") || sessionStorage.getItem(STORAGE_TARGET) || (onBeen ? "cloud" : "local");
    tokenInput.value = params.get("k") || sessionStorage.getItem(STORAGE_TOKEN) || "";

    function token() {
      return tokenInput.value.trim();
    }

    function endpoints() {
      if (target === "local") {
        return {
          status: "http://127.0.0.1:8091/play/api/status",
          claim: "http://127.0.0.1:8091/play/api/claim",
          playerBase: "http://127.0.0.1:18880/player.html",
          ss: "",
        };
      }
      return {
        status: onBeen ? "/play/api/status" : "https://been.chat/play/api/status",
        claim: onBeen ? "/play/api/claim" : "https://been.chat/play/api/claim",
        playerBase: onBeen ? "/play/player/player.html" : "https://been.chat/play/player/player.html",
        ss: "wss://been.chat/ps/player",
      };
    }

    function setTarget(next) {
      target = next;
      sessionStorage.setItem(STORAGE_TARGET, target);
      btnLocal.classList.toggle("active", target === "local");
      btnCloud.classList.toggle("active", target === "cloud");
      refresh();
    }

    function playerHref(seat, role) {
      const q = new URLSearchParams({
        HoveringMouse: "true",
        AutoConnect: "true",
        AutoPlayVideo: "true",
        WaitForStreamer: "true",
      });
      const ep = endpoints();
      if (ep.ss) q.set("ss", ep.ss);
      if (role === "watch") {
        q.set("MatchViewportRes", "true");
        q.set("KeyboardInput", "false");
        q.set("MouseInput", "false");
        q.set("TouchInput", "false");
        q.set("GamepadInput", "false");
      }
      return ep.playerBase + "?" + q.toString();
    }

    async function claim(seatId, role) {
      const key = token();
      if (!key) {
        err.textContent = "请先填写口令。";
        return false;
      }
      const res = await fetch(endpoints().claim, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: key, seat: String(seatId), role }),
      });
      if (res.status === 409) {
        err.textContent = "该座位已有玩家，请改选观看。";
        return false;
      }
      if (!res.ok) {
        err.textContent = "无法加入座位。";
        return false;
      }
      return true;
    }

    function render(seats) {
      box.innerHTML = "";
      seats.forEach((seat) => {
        const card = document.createElement("div");
        card.className = "card";
        const state = !seat.online
          ? "主机离线"
          : !seat.streaming
            ? "等待开播"
            : seat.hasPlayer
              ? "游玩中"
              : "可加入";
        card.innerHTML = `<strong>座位 ${seat.id + 1}</strong> · ${seat.streamerId}<div class="muted">${state}</div>`;
        const row = document.createElement("div");
        row.className = "row";
        const play = document.createElement("a");
        play.className = "btn";
        play.textContent = "游玩";
        const canPlay = seat.online && seat.streaming && !seat.hasPlayer;
        if (!canPlay) play.setAttribute("disabled", "true");
        play.href = "#";
        play.onclick = async (ev) => {
          ev.preventDefault();
          if (!canPlay) return;
          if (await claim(seat.id, "play")) location.href = playerHref(seat, "play");
        };
        const watch = document.createElement("a");
        watch.className = "btn";
        watch.textContent = "观看";
        const canWatch = seat.online && seat.streaming;
        if (!canWatch) watch.setAttribute("disabled", "true");
        watch.href = "#";
        watch.onclick = async (ev) => {
          ev.preventDefault();
          if (!canWatch) return;
          if (await claim(seat.id, "watch")) location.href = playerHref(seat, "watch");
        };
        row.appendChild(play);
        row.appendChild(watch);
        card.appendChild(row);
        box.appendChild(card);
      });
    }

    async function refresh() {
      err.textContent = "";
      const key = token();
      if (!key) {
        err.textContent = "填写口令后显示座位。";
        box.innerHTML = "";
        return;
      }
      sessionStorage.setItem(STORAGE_TOKEN, key);
      try {
        const res = await fetch(endpoints().status + "?k=" + encodeURIComponent(key));
        if (res.status === 403) {
          err.textContent = "口令不正确。";
          box.innerHTML = "";
          return;
        }
        if (!res.ok) {
          err.textContent = target === "local" ? "本机状态服务未就绪（先运行 start_local.py）。" : "云端状态服务未就绪。";
          box.innerHTML = "";
          return;
        }
        const data = await res.json();
        render(data.seats || []);
      } catch (exc) {
        err.textContent = target === "local"
          ? "连不上本机 8091，请先启动 status_server / start_local.py。"
          : "连不上 been.chat /play/api。";
        box.innerHTML = "";
      }
    }

    document.getElementById("open-player").onclick = (ev) => {
      ev.preventDefault();
      location.href = playerHref({ id: 0 }, "play");
    };
    btnLocal.onclick = () => setTarget("local");
    btnCloud.onclick = () => setTarget("cloud");
    tokenInput.addEventListener("change", refresh);
    tokenInput.addEventListener("keydown", (ev) => {
      if (ev.key === "Enter") refresh();
    });
    setTarget(target);
    setInterval(refresh, 5000);
  </script>
</body>
</html>
