# 宝塔：网站 → been.chat → 设置 → 配置文件
# 把下面整段追加到 server { } 里、写在 location / 之前或之后均可。
# 不要整段替换现有配置，不要改 root / location / 。
# 主站 /www/wwwroot/been.chat/index.html 与 Images/ 保持不动。

    location /play/api/ {
        proxy_pass http://127.0.0.1:8091;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location /play/player/ {
        alias /www/wwwroot/been.chat/play/player/;
        index player.html;
    }

    location /play/ {
        alias /www/wwwroot/been.chat/play/;
        index index.html;
    }

    location /ps/player/ {
        proxy_pass http://127.0.0.1:18880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /ps/player {
        proxy_pass http://127.0.0.1:18880/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /ps/streamer/ {
        proxy_pass http://127.0.0.1:18888/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }

    location /ps/streamer {
        proxy_pass http://127.0.0.1:18888/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
    }
