# Append ONLY these locations into the existing been.chat HTTPS server block.
# Do not replace location / and do not overwrite /www/wwwroot/been.chat/index.html.
#
# Upload:
#   local/index.html  -> /www/wwwroot/been.chat/play/index.html
#   official www      -> /www/wwwroot/been.chat/play/player/
#
# Wilbur on this box: 127.0.0.1:18888 (streamer) and 127.0.0.1:18880 (players).
# Do not use 8888 — 宝塔面板占用该端口。
# status_server.py on 127.0.0.1:8091 with SLIME_PLAY_TOKEN.

location /play/api/ {
    proxy_pass http://127.0.0.1:8091;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
}

location /play/player/ {
    alias /www/wwwroot/been.chat/play/player/;
    index player.html;
}

location /play/ {
    alias /www/wwwroot/been.chat/play/;
    index index.html;
}

location /ps/player/ {
    proxy_pass http://127.0.0.1:18880/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}

location /ps/player {
    proxy_pass http://127.0.0.1:18880/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}

location /ps/streamer/ {
    proxy_pass http://127.0.0.1:18888/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}

location /ps/streamer {
    proxy_pass http://127.0.0.1:18888/;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 3600s;
}
