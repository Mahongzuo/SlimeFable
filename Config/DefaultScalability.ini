; SlimeFable scalability overrides. Engine BaseScalability.ini still applies;
; this file only turns down the heaviest Lumen/shadow/RT knobs per sg.* level.
; USlimeGraphicsSettings::SetQualityLevel maps 0..3 onto OverallScalabilityLevel.

[ShadowQuality@0]
r.ShadowQuality=1
r.Shadow.CSM.MaxCascades=1
r.Shadow.Virtual.Enable=0
r.Shadow.CSM.TransitionScale=0.25

[ShadowQuality@1]
r.ShadowQuality=2
r.Shadow.CSM.MaxCascades=2
r.Shadow.Virtual.Enable=1

[ShadowQuality@2]
r.ShadowQuality=4
r.Shadow.Virtual.Enable=1

[ShadowQuality@3]
r.ShadowQuality=5
r.Shadow.Virtual.Enable=1

[GlobalIlluminationQuality@0]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.TraceMeshSDFs=0
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=8
r.LumenScene.Radiosity.ProbeSpacing=64
r.RayTracing.ForceAllRayTracingEffects=0

[GlobalIlluminationQuality@1]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.TraceMeshSDFs=0
r.Lumen.ScreenProbeGather.RadianceCache.ProbeResolution=16
r.RayTracing.ForceAllRayTracingEffects=0

[GlobalIlluminationQuality@2]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.TraceMeshSDFs=0
r.RayTracing.ForceAllRayTracingEffects=0

[GlobalIlluminationQuality@3]
r.DynamicGlobalIlluminationMethod=1
r.Lumen.TraceMeshSDFs=0
r.RayTracing.ForceAllRayTracingEffects=0

[ReflectionQuality@0]
r.ReflectionMethod=1
r.Lumen.Reflections.DownsampleFactor=2
r.RayTracing.ForceAllRayTracingEffects=0

[ReflectionQuality@1]
r.ReflectionMethod=1
r.Lumen.Reflections.DownsampleFactor=2
r.RayTracing.ForceAllRayTracingEffects=0

[ReflectionQuality@2]
r.ReflectionMethod=1
r.RayTracing.ForceAllRayTracingEffects=0

[ReflectionQuality@3]
r.ReflectionMethod=1
r.RayTracing.ForceAllRayTracingEffects=0

[EffectsQuality@0]
r.TranslucencyLightingVolumeDim=24
r.RayTracing.ForceAllRayTracingEffects=0

[EffectsQuality@1]
r.RayTracing.ForceAllRayTracingEffects=0

[EffectsQuality@2]
r.RayTracing.ForceAllRayTracingEffects=0

[EffectsQuality@3]
r.RayTracing.ForceAllRayTracingEffects=0

[PostProcessQuality@0]
r.BloomQuality=1
r.AmbientOcclusionLevels=0
r.DepthOfFieldQuality=0

[PostProcessQuality@1]
r.BloomQuality=2
r.AmbientOcclusionLevels=1

[FoliageQuality@0]
foliage.DensityScale=0.4
grass.DensityScale=0.4
