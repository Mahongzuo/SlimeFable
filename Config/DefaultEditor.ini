[UnrealEd.SimpleMap]
SimpleMapName=/Game/ThirdPersonCPP/Maps/ThirdPersonExampleMap

[EditoronlyBP]
bAllowClassAndBlueprintPinMatching=true
bReplaceBlueprintWithClass= true
bDontLoadBlueprintOutsideEditor= true
bBlueprintIsNotBlueprintType= true

; 8000 is often occupied on Windows; keep Unreal MCP on 8010.
; Do NOT auto-start: Cook/Package runs UnrealEditor-Cmd which would also bind 8010.
; A bind failure logs Error and makes UAT treat a successful Cook as ExitCode=1.
; Start manually in editor: ModelContextProtocol.StartServer 8010
[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
ServerUrlPath=/mcp
ServerPortNumber=8010
bAutoStartServer=False
bEnableToolSearch=True

